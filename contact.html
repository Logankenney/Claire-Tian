  <main class="sheet">
    <h2>contact... please don't</h2>
    <p><a class="go" id="mail" href="#">email</a></p>
    <p><a class="go" href="https://www.instagram.com/maisonsumika/" rel="noopener">instagram, @maisonsumika</a></p>
    <h2 style="margin-top:70px">to request a shoot</h2>
    <p>a request, not a booking. replies are not instant.</p>
    <form id="booking" novalidate>
      <label>name<input name="name" autocomplete="name" required></label>
      <label>email<input name="email" type="email" autocomplete="email" required></label>
      <label>kind
        <select name="kind" required>
          <option value="">choose</option><option>portraits</option><option>editorial</option><option>event</option><option>other</option>
        </select></label>
      <label>date<input name="date" type="date" required></label>
      <label>where<input name="place"></label>
      <label>the idea<textarea name="idea"></textarea></label>
      <label class="hp" aria-hidden="true">leave this empty<input name="website" tabindex="-1" autocomplete="off"></label>
      <button class="send" type="submit">send</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

<script src="site.js"></script>
<script src="booking.js"></script>
</body>
