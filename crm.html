<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>crm · claire tian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crm.css?v=1">
</head>
<body>
  <!-- the crm for claire and logan: who has joined, what they look at, marketing opt-ins, notes. staff and admin only
       (crm/schema.sql). the same page runs inside the mac app (mac/). not linked from the site. -->
  <header class="bar">
    <b class="mark">claire tian · crm</b>
    <span id="nums" class="nums"></span>
    <span class="grow"></span>
    <span id="me" class="muted"></span>
    <button class="text" id="refresh" type="button" hidden>refresh</button>
    <button class="text" id="signout" type="button" hidden>sign out</button>
  </header>

  <section id="gate" class="gate" hidden>
    <form id="g-email" novalidate>
      <label for="g-addr">sign in. your email</label>
      <input id="g-addr" type="email" autocomplete="email" spellcheck="false">
      <button class="send" type="submit">send code</button>
    </form>
    <form id="g-code" novalidate hidden>
      <label for="g-num">the 6 numbers in the email</label>
      <input id="g-num" inputmode="numeric" autocomplete="one-time-code" maxlength="10">
      <button class="send" type="submit">sign in</button>
      <button class="text" type="button" id="g-back">use another email</button>
    </form>
    <p class="status" id="g-status" role="status" aria-live="polite"></p>
  </section>

  <main id="app" class="app" hidden>
    <section class="list">
      <div class="filters">
        <input id="q" type="search" placeholder="search email, name, tag" spellcheck="false">
        <select id="f-stage" aria-label="stage"><option value="">every stage</option></select>
        <select id="f-perm" aria-label="access"><option value="">all access</option></select>
        <label class="tick"><input id="f-mk" type="checkbox"> opted in</label>
        <span class="grow"></span>
        <button class="text" id="csv" type="button">export list</button>
        <button class="text" id="csv-mk" type="button">export opted-in emails</button>
      </div>
      <div class="scroll">
        <table id="rows">
          <thead><tr><th>email</th><th>name</th><th>stage</th><th>access</th><th>email ok</th><th class="r">visits</th><th class="r">sign-ins</th><th>last seen</th><th>joined</th></tr></thead>
          <tbody></tbody>
        </table>
        <p id="empty" class="muted pad" hidden>no one yet.</p>
      </div>
    </section>

    <section class="detail" id="detail">
      <p class="muted pad">pick someone on the left.</p>
    </section>
  </main>
  <p class="status foot-status" id="status" role="status" aria-live="polite"></p>

<script src="auth.js?v=1"></script>
<script src="crm.js?v=1"></script>
</body>
</html>
